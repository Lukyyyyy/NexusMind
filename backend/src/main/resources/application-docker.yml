server:
  port: ${BACKEND_PORT:18081}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:24}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:256}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:32}

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nexusmind}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:nexusmind}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: NexusMindHikariCP
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:6}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:1}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT:5000}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0
          max-wait: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      properties:
        spring.json.trusted.packages: "com.luky.nexusmind.model"
        max.poll.records: 1
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  bucketName: ${MINIO_BUCKET:nexusmind-uploads}
  publicUrl: ${MINIO_PUBLIC_URL:http://127.0.0.1:9000}

jwt:
  secret-key: ${JWT_SECRET_KEY:}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}
  email: ${ADMIN_EMAIL:}
  primary-org: default
  org-tags: default,admin

app:
  public-url: ${APP_PUBLIC_URL:http://127.0.0.1:9527}
  test-endpoints-enabled: ${APP_TEST_ENDPOINTS_ENABLED:false}

security:
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window-seconds: ${LOGIN_WINDOW_SECONDS:60}
    lock-seconds: ${LOGIN_LOCK_SECONDS:300}

file:
  download:
    public-url: ${APP_PUBLIC_URL:http://127.0.0.1:9527}
    ticket-ttl: ${FILE_DOWNLOAD_TICKET_TTL:5m}
    ticket-single-use: ${FILE_DOWNLOAD_TICKET_SINGLE_USE:true}
  parsing:
    chunk-size: 512
    min-chunk-size: 256
    max-chunk-size: 1024
    buffer-size: 8192
    max-memory-threshold: 0.82
    mineru:
      base-url: ${MINERU_BASE_URL:http://mineru-api:8000}
      parse-path: ${MINERU_PARSE_PATH:/file_parse}
      backend: ${MINERU_BACKEND:pipeline}
      parse-method: ${MINERU_PARSE_METHOD:txt}
      ocr: ${MINERU_OCR:true}
      enable-table: ${MINERU_ENABLE_TABLE:true}
      enable-formula: ${MINERU_ENABLE_FORMULA:true}
      fallback-to-tika: true

elasticsearch:
  host: ${ELASTICSEARCH_HOST:elasticsearch}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: http
  username: elastic
  password: ${ELASTICSEARCH_PASSWORD:}

knowledge-graph:
  enabled: ${KNOWLEDGE_GRAPH_ENABLED:true}
  retrieval:
    default-max-hops: ${KNOWLEDGE_GRAPH_DEFAULT_MAX_HOPS:3}
    hard-max-hops: ${KNOWLEDGE_GRAPH_HARD_MAX_HOPS:4}
    candidate-path-limit: ${KNOWLEDGE_GRAPH_CANDIDATE_PATH_LIMIT:200}
    timeout-seconds: ${KNOWLEDGE_GRAPH_QUERY_TIMEOUT_SECONDS:5}
    backfill-batches-per-call: ${KNOWLEDGE_GRAPH_BACKFILL_BATCHES_PER_CALL:2}
  neo4j:
    uri: ${NEO4J_URI:bolt://neo4j:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:}
    max-connection-pool-size: ${NEO4J_MAX_CONNECTION_POOL_SIZE:20}

embedding:
  api:
    concurrent-enabled: true
    max-concurrency: 2

langfuse:
  tracing:
    enabled: ${LANGFUSE_TRACING_ENABLED:false}
    capture-content: ${LANGFUSE_CAPTURE_CONTENT:false}

logging:
  level:
    org.springframework.web: WARN
    org.springframework.boot.autoconfigure.web.servlet: WARN
    org.springframework.security: WARN
    com.luky.nexusmind.service: INFO
    com.luky.nexusmind.client: INFO
    io.minio: WARN
