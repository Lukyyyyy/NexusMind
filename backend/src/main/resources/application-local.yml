server:
  port: ${BACKEND_PORT:18081}

spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/nexusmind?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: 127.0.0.1:${KAFKA_PORT:9092}
    topic:
      file-processing: ${KAFKA_FILE_PROCESSING_TOPIC:file-processing-topic1}
      dlt: ${KAFKA_FILE_PROCESSING_DLT_TOPIC:file-processing-dlt}

minio:
  endpoint: http://localhost:${MINIO_API_PORT:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ${MINIO_BUCKET:uploads}
  publicUrl: http://localhost:${MINIO_API_PORT:9000}

elasticsearch:
  host: localhost
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: http
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}

file:
  parsing:
    mineru:
      base-url: ${MINERU_BASE_URL:}

langfuse:
  tracing:
    enabled: ${LANGFUSE_TRACING_ENABLED:false}
    base-url: ${LANGFUSE_BASE_URL:https://us.cloud.langfuse.com}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    environment: ${LANGFUSE_TRACING_ENVIRONMENT:dev}
    capture-content: ${LANGFUSE_CAPTURE_CONTENT:false}
