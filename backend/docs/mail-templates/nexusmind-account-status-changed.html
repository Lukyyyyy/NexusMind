<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>账户状态变更</title></head>
<body style="margin:0;background:#f5f7fb;color:#263247;font-family:'Microsoft YaHei',sans-serif">
<div style="max-width:560px;margin:32px auto;padding:32px;border:1px solid #e5eaf1;border-radius:12px;background:#fff">
  <h1 style="margin:0 0 20px;color:#245bdb;font-size:22px">知枢 NexusMind</h1>
  <p>{{displayName}}，您好：</p>
  <p>你的知枢 NexusMind 账户已<strong>{{action}}</strong>。</p>
  <p>操作时间：{{time}}</p>
  <p>变更原因：{{reason}}</p>
  <p>原登录会话已失效。若账户已重新启用，请重新登录；若账户被禁用，请联系超级管理员。</p>
  <p style="margin-top:24px;padding-top:16px;border-top:1px solid #e5eaf1;color:#98a2b3;font-size:12px">此邮件由系统自动发送，请勿直接回复。</p>
</div></body></html>
